# productionController — multi-company / multi-line sensor detection
#
# Discovers all companies and their production lines from the backend.
# For each line that has signal_catalog WinCC rows (production_line_id FK),
# evaluates sensors and auto-creates / completes production runs.
#
# Thresholds aligned with AI_ML_Service/state/rules_config.yaml low_production
# floors. Tune here only — no code change.

# Debounce: consecutive polling ticks required before acting
start_debounce_ticks: 3   # N ticks active → CREATE run
stop_debounce_ticks: 5    # N ticks inactive → COMPLETE run

# Polling interval (seconds)
poll_interval_sec: 5

# Re-discover companies / lines / catalog links (seconds)
topology_refresh_sec: 300

# Discovery filters
only_active_lines: true
skip_lines_without_signals: true   # require signal_catalog.production_line_id

# Optional scope filters (empty = all). Env COMPANY_ID / PRODUCTION_LINE_ID
# also act as filters when set.
company_ids: []
company_names: []
production_line_ids: []
production_line_names: []

# Auto-detected runs are never trial runs
is_trial: false

# Comment written on auto-created runs (operator can edit later)
auto_run_comment: "Automatisch aus Sensoren erkannt — wartet auf Bestätigung durch den Bediener"

# On startup / topology refresh: adopt existing RUNNING run for each line
adopt_existing_run_on_startup: true

# ─── Production-active detection (per production_line_id) ───
# Uses only signal_catalog rows linked to that line.
# Aggregate = mean of matching value_scaled (group + optional role).
production_active:
  min_conditions_ratio: 1.0   # all must pass
  require_good_quality: true
  conditions:
    - group: status
      role: null
      operator: gte
      threshold: 1.0
    - group: feeders
      role: actual
      operator: gte
      threshold: 50.0
    - group: extruder_meltpump
      role: actual
      operator: gte
      threshold: 15.0
    - group: melt_pressure
      role: actual
      operator: gte
      threshold: 40.0
