networks:
  sunporNet:
    external: true

services:
  backend:
    build: .

    container_name: sunpor-backend

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg2://sunpor_user:sunpor_password@sunpor-timescaledb:5432/sunpor_db
      OPERATOR_ASSIST_URL: http://sunpor-operator-assist:8010
      OPERATOR_ASSIST_TIMEOUT_SECONDS: "3"

    ports:
      - "8000:8000"

    volumes:
      - ./logs:/app/logs

    networks:
      - sunporNet

